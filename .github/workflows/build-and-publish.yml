name: Build and Publish

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-build-and-publish.yml
    with:
      runner: 'ubuntu-latest'
      is-release-build: false
      release-version-type: 'alpha'
      release-changelog: ''
      run-build-scan: true
      publish-artifacts: false
    secrets: inherit
